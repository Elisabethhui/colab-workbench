# rPPG-Toolbox 项目配置（入 git，不含任何密钥）
# 复制本文件为 config/<新项目>.toml 即可开新项目

[project]
name      = "rppg"
repo_url  = "https://github.com/ubicomplab/rPPG-Toolbox.git"
repo_name = "rPPG-Toolbox"
# 钉死的上游版本（完整 sha）。空值 = 只用默认分支最新，不建议。
# 为什么必须钉：hooks.py 里 6 处源码补丁匹配的是这个 commit 的具体字符串，
# 上游一改补丁就静默失效；依赖也是按这个版本的 requirements 装的。
repo_ref  = "b7500b848f84ad7f86e277b4612563b69f4f88f9"

# ---------------------------------------------------------------- 依赖探针
# 只写两类包：
#   1) Colab 不预装的（否则探针恒为"已安装"，等于没探）
#   2) 版本敏感的（例如 opencv 必须是 4.10，而 Colab 预装 5.0）
# 值 = 期望版本前缀；空字符串表示"只要装了就行"
[deps]
yacs                  = ""
neurokit2             = ""
opencv-python-headless = "4.10"

# 可选：额外命令（在仓库目录下执行）
# commands = ["python -m pip install -q -e ."]

# ---------------------------------------------------------------- 数据
# 数据一律落 Google Drive：Colab_Projects/cache/kaggle/<owner>__<dataset>
# 不在 /content 留存（只有解压时的临时包会短暂停留，跑完自动清）
# 钉数据版本：[[data]] 里加 version = 3 → 拉 slug/versions/3；不写 = latest
# check = 就绪判据的 glob；只判 manifest 存在 + 文件数达标

[[data]]
source = "kaggle"
slug   = "maleehanasirkhan/ubfc-rppg-part1"
check  = "**/subject*_vid.avi"

[[data]]
source = "kaggle"
slug   = "maleehanasirkhan/ubfc-rppg-part2"
check  = "**/subject*_vid.avi"

# 小数据也可以走 HF，同样直落 Drive：
# 目录会是 cache/huggingface/<repo_type>/<org>__<name>@<revision>
# [[data]]
# source    = "hf"
# repo      = "your-name/ubfc-processed"
# revision  = "main"
# repo_type = "dataset"
